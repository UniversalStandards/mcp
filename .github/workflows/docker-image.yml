name: Docker image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run containerized verification stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: verify
          push: false
          cache-from: type=gha,scope=verify-stage
          cache-to: type=gha,mode=max,scope=verify-stage

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: universal-standards-mcp:ci-${{ github.sha }}
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image

      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail

          image="universal-standards-mcp:ci-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "nodejs"
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$image")" = "/app"
          test "$(docker image inspect --format '{{.Config.Healthcheck.Test}}' "$image")" != "<no value>"

      - name: Start container with production-safe defaults
        shell: bash
        run: |
          set -euo pipefail

          image="universal-standards-mcp:ci-${GITHUB_SHA}"
          docker run --detach --rm \
            --name universal-standards-mcp-ci \
            --publish 127.0.0.1:3000:3000 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env NODE_ENV=production \
            --env HOST=0.0.0.0 \
            --env PORT=3000 \
            --env MCP_ALLOWED_HOSTS=127.0.0.1,localhost \
            "$image"

      - name: Smoke-test liveness and readiness
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker logs universal-standards-mcp-ci || true
            docker stop universal-standards-mcp-ci || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health/live; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container did not become live within 60 seconds" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/health/ready
