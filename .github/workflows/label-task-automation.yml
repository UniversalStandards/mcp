name: Label-Based Task Automation (disabled)

# Label-triggered code changes, secret-backed AI execution, deployment, and
# automatic merging remain disabled until each action has an explicit policy,
# approval boundary, sandbox, and auditable implementation.
# Restore through a reviewed PR implementing and testing those controls;
# changing the dispatch acknowledgement alone cannot activate this workflow.
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Acknowledge that this workflow is intentionally disabled'
        required: true
        type: boolean

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Label-based automation is intentionally disabled
        run: |
          echo '::error::Disabled. Restore only through a reviewed implementation with the approval and sandbox controls documented above.'
          exit 1
