name: MCP Server Install Review

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: 'MCP package name to review; no installation is performed'
        required: true
      source:
        description: 'Registry source label for the audit trail'
        required: true
        type: choice
        options:
          - github-registry
          - official-registry
          - npm

permissions: {}

jobs:
  review:
    name: Review package metadata without repository mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.x'

      - name: Validate package identifier
        run: |
          if [[ ! "$SERVER_ID" =~ ^(@[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid npm package identifier: $SERVER_ID" >&2
            exit 1
          fi
          echo "Reviewing $SERVER_ID from the '${SOURCE}' source label."
        env:
          SERVER_ID: ${{ inputs.server_id }}
          SOURCE: ${{ inputs.source }}

      - name: Inspect registry metadata
        run: npm view "$SERVER_ID" version dist.integrity --json
        env:
          SERVER_ID: ${{ inputs.server_id }}
