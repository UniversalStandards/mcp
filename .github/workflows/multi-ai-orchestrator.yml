# Restore only through a reviewed PR with isolated workers, verified action
# pins, bounded budgets, tests, and approval for external side effects.
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Acknowledge that this workflow is intentionally disabled'
        required: true
        type: boolean

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Multi-AI orchestration is intentionally disabled
        run: |
          echo '::error::Disabled. Restore only through a reviewed implementation with isolated workers and explicit side-effect approval.'
          exit 1
