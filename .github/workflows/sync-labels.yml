name: Sync Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Sync Labels to Repository
    permissions:
      contents: read
      issues: write
          
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.x'

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      
      - name: Parse labels configuration
        id: parse
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const yaml = require('js-yaml');
          const config = yaml.load(fs.readFileSync('.github/labels.yml', 'utf8')) ?? {};
          const labels = config.labels ?? [];
          if (!Array.isArray(labels)) {
            throw new Error('labels must be an array');
          }
          console.log(`Found ${labels.length} labels to sync`);
          fs.writeFileSync('labels.json', JSON.stringify(labels, null, 2));
          NODE
      
      - name: Sync labels to repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('labels.json', 'utf8'));
            
            console.log(`Syncing ${labels.length} labels...`);
            
            // Get existing labels
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const existingLabelMap = new Map(
              existingLabels.map(label => [label.name, label])
            );
            
            let created = 0;
            let updated = 0;
            let skipped = 0;
            let failures = 0;
            
            for (const label of labels) {
              try {
                if (existingLabelMap.has(label.name)) {
                  // Update existing label
                  const existing = existingLabelMap.get(label.name);
                  if (existing.color !== label.color || existing.description !== label.description) {
                    await github.rest.issues.updateLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label.name,
                      color: label.color,
                      description: label.description
                    });
                    console.log(`✓ Updated label: ${label.name}`);
                    updated++;
                  } else {
                    console.log(`- Skipped label (no changes): ${label.name}`);
                    skipped++;
                  }
                } else {
                  // Create new label
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`+ Created label: ${label.name}`);
                  created++;
                }
              } catch (error) {
                console.error(`Error processing label ${label.name}:`, error.message);
                failures++;
              }
            }
            
            // Create summary
            const summary = `
            ## 🏷️ Label Sync Summary
            
            - ✅ Created: ${created}
            - 🔄 Updated: ${updated}
            - ⏭️ Skipped: ${skipped}
            - 📊 Total: ${labels.length}
            
            ### Labels Configured:
            ${labels.map(l => `- \`${l.name}\` - ${l.description}`).join('\n')}
            `;
            
            core.summary.addRaw(summary);
            await core.summary.write();

            if (failures > 0) {
              core.setFailed(`Label sync failed for ${failures} label(s).`);
            }

            console.log(`\nSync completed: ${created} created, ${updated} updated, ${skipped} skipped, ${failures} failed`);
